name: Build CI

# Called by ci-orchestrator.yml.
#
# Scope: compile + link + run test_package/main.cpp on every supported platform, in the one
# build type metadata.json declares. Keeping this half cheap is what lets it run everywhere;
# the test suite and coverage belong to full-test-automation.yml.

on:
  workflow_call:
    inputs:
      pkg_name:
        description: 'Package name from metadata.json'
        required: true
        type: string
      build_type:
        description: 'Build type from metadata.json: the single source of truth for CI'
        required: false
        type: string
        default: 'Debug'

env:
  CONAN_HOME: ~/.conan2

jobs:
  build-and-test:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast off: every leg must report its own result
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # the package manager is the one genuine per-OS difference left
          - os: ubuntu-latest
            pkg_conf: '-c tools.system.package_manager:sudo=True'
          - os: macos-latest
            pkg_conf: '-c tools.system.package_manager:sudo=True'
          - os: windows-latest
            pkg_conf: '-c tools.system.package_manager:tool=choco'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Conan
        shell: bash
        run: |
          pip install --only-binary :all: conan==2.31.2

      - name: Configure Conan
        shell: bash
        run: |
          echo "CONAN_HOME=${{ env.CONAN_HOME }}" >> $GITHUB_ENV
          conan profile detect --force

      - name: System dependencies (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt install -y libnsl-dev

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'metadata.json') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Build the package and run main.cpp
        shell: bash
        # HET_CMAKE_BUILD_REQUIRE is the escape hatch for this leg alone if a runner's toolchain
        # ever outgrows the cmake metadata.json pins: a version pins another, `none` uses PATH.
        # The conf namespace is the template's, not the package's: renaming the project in
        # metadata.json must never mean editing this line.
        run: |
          conan create . -pr:b=default -pr:h=default -s build_type=${{ inputs.build_type }} --build=missing \
          -c user.het:run_tests=False \
          -c tools.system.package_manager:mode=install ${{ matrix.pkg_conf }}
        timeout-minutes: 55

      - name: Clean up test_package builds
        shell: bash
        run: |
          python ./test_package/conanfile.py

      - name: Clean up Conan packages
        if: always()
        shell: bash
        run: |
          conan remove "${{ inputs.pkg_name }}/*" --confirm
