name: MegaLinter

# Called by ci-orchestrator.yml on the :shield: gitmoji
#
# fcpp-dev keeps a debug trigger; under the orchestrator the gitmoji logic lives in the controller

on:
  workflow_call:
    inputs:
      validate_all_codebase:
        description: 'Whether to validate all source code or just the diff'
        required: false
        type: string
        default: 'false'

env:
  # Strict gate mode: never auto-fix in CI, lint failures fail the job.
  APPLY_FIXES: none

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-security
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          # system packages derive from conandata.yml; extend the mapping for new deps whose headers land in src/
          DEPS=$(python3 - <<'PY'
          import yaml
          reqs = yaml.safe_load(open('conandata.yml'))['requirements']
          mapping = {'zlib': 'zlib1g-dev', 'pcre2': 'libpcre2-dev', 'eigen': 'libeigen3-dev'}
          pkgs = {mapping[r.split('/')[0]] for r in reqs if r.split('/')[0] in mapping}
          print(' '.join(sorted(pkgs)))
          PY
          )
          sudo apt-get install -y clang-tidy $DEPS
          # apt clang-format 18 lacks the "Language: C" section (< 19) -- pin the pip build
          python3 -m pip install --only-binary :all: clang-format==23.1.0

      # ETL is header-only with no apt package: fetch the version declared in conandata.yml
      - name: Install ETL headers (version from conandata.yml)
        run: |
          ETL_VER=$(python3 -c "import yaml; d=yaml.safe_load(open('conandata.yml')); print([r for r in d['requirements'] if r.startswith('etl/')][0].split('/')[1])")
          curl --proto '=https' --proto-redir '=https' -sSL -o /tmp/etl.zip "https://github.com/ETLCPP/etl/archive/refs/tags/${ETL_VER}.zip"
          unzip -q /tmp/etl.zip -d /tmp/etl-src
          echo "ETL_INC=/tmp/etl-src/etl-${ETL_VER}/include" >> "$GITHUB_ENV"

      # required: formatting clean; .h routes to C, .hpp to C++ (see code-conventions.md)
      - name: clang-format gate
        run: |
          find include src -type f \( -name '*.c' -o -name '*.h' \) \
            -exec clang-format --dry-run --Werror --style=file:.github/misc/.clang-format-c {} +
          find include src -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -exec clang-format --dry-run --Werror --style=file:.github/misc/.clang-format-cpp {} +

      # required: clang-tidy warnings are failures; only include|src diagnostics count
      - name: clang-tidy gate
        run: |
          shopt -s nullglob
          for f in src/*.c; do
            clang-tidy --config-file=.github/misc/.clang-tidy "$f" -- -std=c11 -Iinclude -I/usr/include/eigen3 -isystem "$ETL_INC"
          done
          for f in src/*.cpp; do
            clang-tidy --config-file=.github/misc/.clang-tidy "$f" -- -std=c++17 -Iinclude -I/usr/include/eigen3 -isystem "$ETL_INC"
          done

      # Required gate: secrets scan with pinned binary version
      - name: gitleaks gate
        run: |
          curl --proto '=https' --proto-redir '=https' -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect -c .github/misc/.gitleaks.toml --no-banner

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    # MegaLinter blocks on the rules it is configured with; it only reads, so callers stay least-privilege
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check Grafana API reporter secrets
        id: check_grafana
        run: |
          if [[ -n "$API_URL" && -n "$API_USER" && -n "$API_PASS" ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✅ Grafana API reporter secrets are configured"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Grafana API reporter secrets not configured — will fallback to artifact upload"
          fi
        env:
          API_URL: ${{ secrets.API_REPORTER_URL }}
          API_USER: ${{ secrets.API_REPORTER_BASIC_AUTH_USERNAME }}
          API_PASS: ${{ secrets.API_REPORTER_BASIC_AUTH_PASSWORD }}

      # devskim/semgrep/checkov block as well; the native gate above is the deterministic baseline
      - name: MegaLinter (with Grafana reporter)
        if: steps.check_grafana.outputs.available == 'true'
        # Pinned to MegaLinter v8.8.0 -- keep in sync with run-megalinter.sh --release
        uses: oxsecurity/megalinter@e08c2b05e3dbc40af4c23f41172ef1e068a7d651
        continue-on-error: false
        id: ml_grafana
        env:
          MEGALINTER_CONFIG: .github/misc/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate_all_codebase }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_REPORTER: true
          API_REPORTER_URL: ${{ secrets.API_REPORTER_URL }}
          API_REPORTER_BASIC_AUTH_USERNAME: ${{ secrets.API_REPORTER_BASIC_AUTH_USERNAME }}
          API_REPORTER_BASIC_AUTH_PASSWORD: ${{ secrets.API_REPORTER_BASIC_AUTH_PASSWORD }}
          API_REPORTER_METRICS_URL: ${{ secrets.API_REPORTER_METRICS_URL }}
          API_REPORTER_METRICS_BASIC_AUTH_USERNAME: ${{ secrets.API_REPORTER_METRICS_BASIC_AUTH_USERNAME }}
          API_REPORTER_METRICS_BASIC_AUTH_PASSWORD: ${{ secrets.API_REPORTER_METRICS_BASIC_AUTH_PASSWORD }}
          API_REPORTER_DEBUG: false

      # Run MegaLinter WITHOUT Grafana API reporter as fallback
      - name: MegaLinter (artifact-only)
        if: steps.check_grafana.outputs.available != 'true'
        # Pinned to MegaLinter v8.8.0 (same as the Grafana path above).
        uses: oxsecurity/megalinter@e08c2b05e3dbc40af4c23f41172ef1e068a7d651
        continue-on-error: false
        id: ml_fallback
        env:
          MEGALINTER_CONFIG: .github/misc/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate_all_codebase }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always upload artifacts as a safety net (works for both paths)
      - name: Archive production artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
