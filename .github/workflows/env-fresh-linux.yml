name: env-fresh · linux

# T23 裸机验证 · Linux —— 模拟「全新 Ubuntu 机器装 VS Code + HeT DevTools 后直接构建」。
#
# 为什么按平台拆成三个 workflow（而不是一个矩阵）：
#   一个平台 = 一个失败面。日志更短、重跑更便宜、红了不必翻别的平台。
#     linux   → 本文件（env-fresh-linux.yml）
#     windows → env-fresh-windows.yml
#     macos   → env-fresh-macos.yml
#   自动门禁（push/PR 的 lint + 单测 + 打包）仍在 ci.yml › verify，不在这里。
#
# 每个作业的日志结构固定为：
#   SCENARIO   这个作业要证明什么（人工判据，直接读）
#   GATE       环境前提（不满足则该作业的结论不成立）
#   PREFLIGHT  runner 自带工具（区分“环境问题”还是“代码问题”）
#   MAIN       真实 VS Code 扩展宿主内跑 [real][STEP n/6] 断言链
#   ASSERT     事后事实（车道是否真的被使用）
#   EVIDENCE   打印 out/real-evidence.txt（同时作为 Artifact 上传）
#
# 角色分工（T27）：功能回归作业一律跑**钉住版** 1.95.0（= engines.vscode 下限 = 对用户的
# 承诺，硬断言 `HET_REAL_EXPECT_VSCODE`）；**最新版**只由 canary 作业负责，它的作用不是
# 回归而是**信号**：新版宿主/UI/API 变了在这里先发现，而不是在用户机器上。
#
# 手动触发：
#   gh workflow run env-fresh-linux --ref main
#   gh workflow run env-fresh-linux --ref main -f scenario=managed
#   gh workflow run env-fresh-linux --ref main -f scenario=canary
#   gh run watch $(gh run list --workflow=env-fresh-linux -L1 --json databaseId -q '.[0].databaseId')

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 要跑哪个场景
        type: choice
        default: all
        options:
          - all
          - managed
          - system
          - canary

jobs:
  linux-managed:
    name: linux · 托管车道（apt 自愈 + 覆盖率）
    # 未填 scenario（空字符串）也必须跑 —— 否则手动派发会“静默什么都不跑”。
    if: ${{ !inputs.scenario || inputs.scenario == 'all' || inputs.scenario == 'managed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: "SCENARIO: 这个作业要证明什么"
        run: |
          echo "::group::SCENARIO — fresh linux · managed lane"
          cat <<'EOF'
          模拟场景：全新 Ubuntu 机器（无 ~/.het-fti、无私有 venv/conan）→ 安装扩展 → 一键准备 → 构建并测试。

          本作业要证明：
            1) 能力优先的 Provider 决策在「有 apt + 免密 sudo」的宿主上真的选择 linux-managed（托管车道）；
            2) 车道能从零自举：私有 venv（pip conan/cmake/ninja）+ 生成式 gcc-13 profile + 私有 CONAN_HOME；
            3) apt 自愈可用：缺 gcc-13/lcov 时经免密 root 自动安装（runner 上通常 lcov 缺失）；
            4) 车道内 `conan create` + GTest 全绿，且覆盖率报告真实生成（lcov/genhtml）；
            5) docs（doxygen+sphinx）在车道内可产出。

          失败时优先看：AssertionError 的上一段 [real] 输出 + ASSERT 步骤 + Artifact。
          EOF
          echo "::endgroup::"

      - name: "GATE 1: 宿主必须还是“裸机”（无托管车道）"
        run: |
          echo "检查项：$HOME/.het-fti 必须不存在 —— 否则本作业就不是“从零自举”，应判失败。"
          if [ -e "$HOME/.het-fti" ]; then echo "::error::unexpected pre-existing lane at $HOME/.het-fti"; exit 1; fi
          echo "✔ no ~/.het-fti on the runner"

      - name: "GATE 2: 车道自愈的前提（apt + 免密 sudo）"
        run: |
          echo "检查项：apt-get 存在 + sudo -n true 成功 —— 这是 linux-managed 被选中并由 root 自愈 gcc-13/lcov 的前提。"
          command -v apt-get >/dev/null || { echo "::error::apt-get missing"; exit 1; }
          sudo -n true || { echo "::error::passwordless sudo unavailable"; exit 1; }
          echo "✔ apt-get + passwordless sudo"

      - name: "PREFLIGHT: runner 自带哪些工具（诊断用）"
        run: |
          echo "::group::PREFLIGHT (diagnostics)"
          echo "os:      $(lsb_release -ds 2>/dev/null || head -2 /etc/os-release | tr '\n' ' ')"
          echo "python3: $(python3 --version 2>&1 || echo none)"
          echo "conan:   $(conan --version 2>/dev/null || echo none)"
          echo "cmake:   $(cmake --version 2>/dev/null | head -1 || echo none)"
          echo "gcc:     $(gcc --version 2>/dev/null | head -1 || echo none)"
          echo "lcov:    $(lcov --version 2>/dev/null || echo none)"
          echo "arch:    $(uname -m)"
          echo "::endgroup::"

      - name: "MAIN: 真实扩展宿主 —— 从零自举托管车道并构建"
        env:
          VSCODE_VERSION: "1.95.0"
          # T28：1.95.0 是 engines.vscode 下限 = 对用户的承诺 → 必须是真的在跑它
          # （证据里 vscode=1.95.0 / vscodeSource=download@1.95.0 已核实），谁漂了谁红。
          HET_REAL_EXPECT_VSCODE: "1.95.0"
          HET_REAL_FRESH: "1"
          HET_REAL_EXPECT_PROVIDER: linux-managed
        run: |
          echo "::group::MAIN — npm run test:real (managed lane, fresh)"
          cat <<'EOF'
          即将执行：npm run test:real
            · 夹具：assets/template → out/real-proj（toolchain=managed，activate_code_coverage=on）
            · 断言链：
                provider == linux-managed
                → het.test：车道自举（venv/pip + apt 自愈）→ conan create --build=missing → GTest 全绿
                → 覆盖率报告 coverage_report/index.html 必须存在（车道 lcov/genhtml）
                → het.docsRun：doxygen + sphinx 产物必须存在
          EOF
          xvfb-run -a npm run test:real
          echo "::endgroup::"

      - name: "ASSERT + POST-MORTEM: 车道真的被使用（事后事实）"
        if: always()
        run: |
          echo "::group::POST-MORTEM — 车道事实（无论成败都打印，用于定位 MAIN 失败原因）"
          LANE="$HOME/.het-fti/managed-env"
          echo "lane root: $LANE"
          if [ -d "$LANE" ]; then
            echo "--- venv/bin (前 20) ---"; ls "$LANE/venv/bin" 2>/dev/null | head -20 || true
            echo "--- 车道 conan ---"; "$LANE/venv/bin/conan" --version 2>/dev/null || echo "(缺失)"
            echo "--- 车道 cmake ---"; "$LANE/venv/bin/cmake" --version 2>/dev/null | head -1 || echo "(缺失)"
            echo "--- CONAN_HOME ---"; ls -a "$LANE/.conan2" 2>/dev/null | head -20 || true
            echo "--- 生成的 profile ---"; cat "$LANE/.conan2/profiles/default" 2>/dev/null || echo "(缺失)"
            echo "--- gcov shim ---"; cat "$LANE/venv/bin/gcov" 2>/dev/null || echo "(无 shim)"
            echo "--- .conan2/p/b (包目录，前 10) ---"; ls "$LANE/.conan2/p/b" 2>/dev/null | head -10 || true
          else
            echo "(车道目录不存在 —— 说明构建没走到托管车道)"
          fi
          echo "--- 宿主相关事实 ---"
          echo "gcc-13: $(command -v gcc-13 || echo 缺) | lcov: $(command -v lcov || echo 缺) | doxygen: $(command -v doxygen || echo 缺) | dot: $(command -v dot || echo 缺)"
          echo "HET_CMAKE_*: ${HET_CMAKE_BUILD_REQUIRE:-(unset)} ${HET_CMAKE_MIN:-(unset)}"
          echo "::endgroup::"
          echo "检查项：构建后 $LANE 必须存在 —— 证明本次构建用的是托管 venv，而不是宿主工具。"
          if [ ! -d "$LANE" ]; then echo "::error::managed lane dir missing after build"; exit 1; fi
          test -x "$LANE/venv/bin/conan" || echo "::warning::lane conan binary not where expected (lane layout changed?)"
          echo "✔ lane in use: $LANE"

      - name: "EVIDENCE: 本作业证明了什么"
        if: always()
        run: |
          echo "::group::EVIDENCE (out/real-evidence.txt)"
          if [ -f out/real-evidence.txt ]; then cat out/real-evidence.txt; else echo "(没有证据文件：作业在写出证据前就失败了，请看上一个失败步骤)"; fi
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-linux-managed
          path: out/real-evidence.txt
          if-no-files-found: ignore

  linux-system:
    name: linux · 本机工具链（system，不建车道）
    if: ${{ !inputs.scenario || inputs.scenario == 'all' || inputs.scenario == 'system' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: "SCENARIO: 这个作业要证明什么"
        run: |
          echo "::group::SCENARIO — fresh linux · system toolchain"
          cat <<'EOF'
          模拟场景：用户明确选择「本机工具链（兼容模式）」——metadata.toolchain="system"。

          本作业要证明：
            1) system 语义真的绕过托管车道（构建后 ~/.het-fti 仍然不存在）；
            2) 只用宿主 conan（pip venv）+ 系统 gcc + 宿主 CMake 就能完成 `conan create` + GTest；
            3) 夹具自动关闭 activate_code_coverage（system/原生不承诺覆盖率），不会在 CMake 阶段炸；
            4) 宿主**已备齐**文档前置（doxygen/graphviz/make + sphinx/numpy）时，文档也能跑通
               —— 即 system 模式是"完整可用"的，只是把准备工具的责任交还用户。

          注意：Provider 决策仍按宿主能力解析（runner 有 apt+sudo → linux-managed），
          但构建分派会因 metadata.toolchain=system 走原生分支 —— 这正是要验证的“显式旁路”。
          宿主**未**备齐工具时，正确行为是"诚实报错 + 可执行指引"（由 docsHints 单测覆盖），
          因此本作业的 SETUP 会先把工具装齐。
          EOF
          echo "::endgroup::"

      - name: "GATE: 裸机前提（无车道 + apt/sudo 让 provider 判到 linux-managed）"
        run: |
          if [ -e "$HOME/.het-fti" ]; then echo "::error::unexpected pre-existing lane"; exit 1; fi
          sudo -n true || { echo "::error::passwordless sudo unavailable (provider 将不是 linux-managed)"; exit 1; }
          echo "✔ fresh host + apt/sudo → provider 预期 linux-managed，构建走 system 分支"

      - name: "SETUP: 宿主工具链（pip conan + 文档前置）"
        run: |
          echo "system 模式 = 用宿主自己的工具，扩展**不会**替你安装（这是设计契约，不是缺陷）。"
          echo "本作业模拟「工具已备齐的用户机」：宿主 conan/doxygen/graphviz/make + venv 里的 sphinx/numpy。"
          echo "· 宿主 conan（pip venv）"
          python3 -m venv /tmp/het-conan
          /tmp/het-conan/bin/pip install --quiet "conan>=2,<3"
          echo "/tmp/het-conan/bin" >> "$GITHUB_PATH"
          /tmp/het-conan/bin/conan profile detect --force
          echo "· 文档前置：apt doxygen/graphviz/make + pip sphinx/numpy（原生 docs 走宿主 python）"
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen graphviz make
          /tmp/het-conan/bin/pip install --quiet 'sphinx>=8,<9' sphinx-intl 'sphinx-rtd-theme>=2,<4' 'numpy>=1.26'
          echo "✔ host conan: $(/tmp/het-conan/bin/conan --version)"
          echo "✔ doxygen: $(doxygen --version) | dot: $(dot -V 2>&1 | head -1)"
          echo "✔ venv numpy/sphinx: $(/tmp/het-conan/bin/python -c 'import numpy, sphinx; print(numpy.__version__)')"
          echo "（宿主缺前置时应当是「诚实报错 + 可执行指引」，由 src/test/docsHints.test.ts 单测覆盖）"

      - name: "MAIN: 真实扩展宿主 —— system 工具链构建"
        env:
          VSCODE_VERSION: "1.95.0"
          HET_REAL_EXPECT_VSCODE: "1.95.0"
          HET_REAL_TOOLCHAIN: system
          HET_REAL_FRESH: "1"
          HET_REAL_EXPECT_PROVIDER: linux-managed
        run: |
          echo "::group::MAIN — npm run test:real (metadata.toolchain=system)"
          cat <<'EOF'
          断言链：provider 仍为 linux-managed（能力决策）→ 但构建走 system 分支
                  → conan create（宿主 conan）→ GTest 全绿
                  → 覆盖率断言跳过（夹具已关 activate_code_coverage）+ docs 仍须成功
          EOF
          xvfb-run -a npm run test:real
          echo "::endgroup::"

      - name: "ASSERT: system 语义不得创建车道"
        if: always()
        run: |
          echo "检查项：构建后 $HOME/.het-fti 必须仍然不存在 —— 否则说明 system 语义偷偷建了托管环境。"
          if [ -e "$HOME/.het-fti" ]; then echo "::error::system toolchain must not provision a lane"; ls -la "$HOME/.het-fti"; exit 1; fi
          echo "✔ no lane created (system semantics respected)"

      - name: "EVIDENCE: 本作业证明了什么"
        if: always()
        run: |
          echo "::group::EVIDENCE (out/real-evidence.txt)"
          if [ -f out/real-evidence.txt ]; then cat out/real-evidence.txt; else echo "(没有证据文件)"; fi
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-linux-system
          path: out/real-evidence.txt
          if-no-files-found: ignore

  # T27 金丝雀：**不钉版本**，跑 runner 上能拿到的**最新版** VS Code。
  # 它的结论不是“回归通过”，而是“在最新宿主上观察到什么” —— 失败不等于产品坏了，
  # 但必须有人看（否则新版宿主的行为变化会在用户机器上第一次被发现）。
  # 只跑 Linux 一份就够：宿主/UI/API 的漂移大多不是平台特定的，而 Windows/macOS 各跑
  # 一份最新版的成本远高于它带来的额外信息。
  linux-canary:
    name: linux · 金丝雀（最新版 VS Code，只出信号）
    if: ${{ inputs.scenario == 'canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: "SCENARIO: 这个作业要证明什么"
        run: |
          echo "::group::SCENARIO — latest VS Code canary"
          cat <<'EOF'
          模拟场景：用户装的是**最新版** VS Code（不是承诺下限 1.95.0）→ 扩展还能不能正常干活。

          本作业要证明（/ 观察）：
            1) 宿主版本：证据里的 vscode=<版本> **就是** runner 下载到的最新版（没有断言，因为它会漂）；
            2) 在最新宿主上：扩展能被发现、能激活、provider 决策仍然正确；
            3) 构建 + 测试仍然全绿（Linux 托管车道）；
            4) 失败时的读法：这是**信号**，不是回归门槛 —— 说明新版宿主有行为变化，
               要么修扩展，要么把 1.95 下限往上提（两者都要有意识地决定）。

          与回归作业的区别（T27）：回归作业一律跑钉住版 1.95.0，且用
          HET_REAL_EXPECT_VSCODE=1.95.0 硬断言；本作业故意不设该断言。
          EOF
          echo "::endgroup::"

      - name: "PREFLIGHT: runner 自带哪些工具（诊断用）"
        run: |
          echo "::group::PREFLIGHT (diagnostics)"
          echo "os:      $(lsb_release -ds 2>/dev/null || head -2 /etc/os-release | tr '\n' ' ')"
          echo "python3: $(python3 --version 2>&1 || echo none)"
          echo "cmake:   $(cmake --version 2>/dev/null | head -1 || echo none)"
          echo "gcc:     $(gcc --version 2>/dev/null | head -1 || echo none)"
          echo "::endgroup::"

      - name: "MAIN: 真实扩展宿主 —— 最新版 VS Code + 托管车道"
        env:
          HET_REAL_FRESH: "1"
          HET_REAL_EXPECT_PROVIDER: linux-managed
          # 允许“没有钉住版本”这条路：没有本地 VS Code 且 VSCODE_VERSION 为空时，
          # harness 默认会拒绝运行（“钉住优先”），这里显式声明“本作业就是要跑最新版”。
          HET_VSCODE_ALLOW_LATEST: "1"
          # 注意：**故意不设** VSCODE_VERSION / HET_REAL_EXPECT_VSCODE。
        run: |
          echo "::group::MAIN — npm run test:real (latest VS Code, canary)"
          cat <<'EOF'
          断言链：扩展被宿主发现 → provider == linux-managed → 车道自举 → conan create + GTest
          另外会打印 [real] host VS Code: <版本> (source: latest(auto)) 并写进证据。
          EOF
          xvfb-run -a npm run test:real
          echo "::endgroup::"

      - name: "EVIDENCE: 本次观察到什么"
        if: always()
        run: |
          echo "::group::EVIDENCE (out/real-evidence.txt)"
          if [ -f out/real-evidence.txt ]; then cat out/real-evidence.txt; else echo "(没有证据文件：作业在写出证据前就失败了，请看上一个失败步骤)"; fi
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-linux-canary
          path: out/real-evidence.txt
          if-no-files-found: ignore
